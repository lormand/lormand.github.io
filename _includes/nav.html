<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}">lormand</a>
  <nav class="site-nav" aria-label="Primary">
    <a href="{{ '/work/' | relative_url }}"{% if page.url contains '/work' %} aria-current="page"{% endif %}>Work</a>

    <a class="nav-ext" href="{{ site.social.youtube[0] }}" rel="noopener noreferrer">YouTube</a>
  </nav>
