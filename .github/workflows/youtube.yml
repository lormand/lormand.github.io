name: Fetch YouTube RSS

on:
  schedule:
    # Weekdays 10:00 UTC — no API key; public RSS only.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-rss
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch RSS into _data/videos.json
        run: python3 scripts/fetch_youtube.py

      - name: Commit only if the video list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/videos.json
          if git diff --staged --quiet; then
            echo "No YouTube changes"
            exit 0
          fi
          git commit -m "chore: refresh YouTube RSS cache"
          git push
